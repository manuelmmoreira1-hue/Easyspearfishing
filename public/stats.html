<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyspearfishing — Estatísticas</title><style>body{font-family:system-ui;background:#f4f7fa;margin:0;color:#15202b}.wrap{max-width:900px;margin:auto;padding:24px}.head{background:linear-gradient(135deg,#7b2cbf,#ff7a00);color:#fff;border-radius:20px;padding:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 5px 20px #0001}.num{font-size:42px;font-weight:900}.muted{color:#64748b}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><h1>📊 Easyspearfishing</h1><div>Estatísticas da utilização da app</div></div><div class="grid"><div class="card"><div class="muted">👥 Acessos totais</div><div id="total" class="num">—</div></div><div class="card"><div class="muted">📅 Acessos hoje</div><div id="today" class="num">—</div></div><div class="card"><div class="muted">👁️ Observações registadas</div><div id="obs" class="num">—</div></div></div><p class="muted">Contagem agregada de sessões. Não são guardados IPs nem nomes para as visitas.</p><p><a href="/">← Voltar à Easyspearfishing</a></p></main><script>async function load(){try{const r=await fetch('/api/stats?ts='+Date.now(),{cache:'no-store'});const d=await r.json();total.textContent=d.totalVisits;today.textContent=d.todayVisits;obs.textContent=d.observations}catch(e){total.textContent='Erro';today.textContent='Erro';obs.textContent='Erro'}}load();setInterval(load,60000);</script></body></html>
