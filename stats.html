<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyspearfishing — Estatísticas</title><style>body{font-family:system-ui;background:#f4f7fa;margin:0;color:#15202b}.wrap{max-width:800px;margin:auto;padding:24px}.card{background:white;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 5px 20px #0001}.num{font-size:42px;font-weight:900}.muted{color:#64748b}</style></head><body><main class="wrap"><h1>📊 Easyspearfishing</h1><div class="card"><div class="muted">Acessos totais</div><div id="total" class="num">—</div></div><div class="card"><div class="muted">Acessos hoje</div><div id="today" class="num">—</div></div><p class="muted">Contagem agregada de sessões. Não são guardados IPs nem nomes.</p></main><script>async function load(){try{const r=await fetch('/api/stats?ts='+Date.now(),{cache:'no-store'});const d=await r.json();document.getElementById('total').textContent=d.totalVisits;document.getElementById('today').textContent=d.todayVisits}catch(e){document.getElementById('total').textContent='Erro'}}load();setInterval(load,60000);</script></body></html>
