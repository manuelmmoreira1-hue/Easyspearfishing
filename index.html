<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easyspearfishing</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fa;color:#15202b}header{background:linear-gradient(135deg,#7b2cbf,#ff7a00);color:#fff;padding:22px 18px}.wrap{max-width:1280px;margin:auto;padding:16px}h1{margin:0;font-size:30px}header p{margin:5px 0 0;opacity:.92}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 5px 20px #0000000d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.spot{border:1px solid #dce3ea;border-radius:14px;padding:13px;background:#fff;text-align:left;cursor:pointer}.spot:hover{border-color:#7b2cbf}.name{font-weight:800}.score{font-size:20px;font-weight:900;margin:4px 0}.mini{font-size:12px;color:#64748b}.status{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef7ee;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.metric{background:#f6f8fa;border-radius:12px;padding:10px}.metric small{color:#64748b}.metric b{font-size:16px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:14px}.decision{border-radius:16px;padding:15px;background:#f7f7ff;border:1px solid #e7ddff}.decision h3{margin:0 0 6px}.big{font-size:25px;font-weight:900}.confidence{font-size:13px;color:#64748b}.reasons{margin:8px 0 0;padding-left:20px}.obsbox{background:#fff8f1;border:1px solid #ffd8b0;border-radius:16px;padding:15px;margin-top:16px}.obsgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.obsgrid button{padding:9px;border:1px solid #dfe5ea;background:#fff;border-radius:10px;cursor:pointer}.obsgrid button.sel{border-color:#7b2cbf;background:#f2eaff;font-weight:800}.formrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.formrow input,.formrow select,.formrow textarea{width:100%;padding:9px;border:1px solid #d8e0e7;border-radius:9px;font:inherit}.formrow textarea{min-height:60px}.submit{margin-top:10px;border:0;border-radius:10px;padding:10px 15px;background:#7b2cbf;color:#fff;font-weight:800;cursor:pointer}.obslist{margin-top:12px;display:grid;gap:7px}.obsitem{background:#fff;border-radius:10px;padding:9px;border:1px solid #eee;font-size:13px}.daily{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}.day{background:#f6f8fa;border-radius:11px;padding:9px}.hourly{overflow:auto;margin-top:16px}.hourly table{border-collapse:separate;border-spacing:0;min-width:1250px;width:100%;font-size:12px}.hourly th,.hourly td{padding:8px 9px;border-bottom:1px solid #e6ebf0;text-align:right;white-space:nowrap}.hourly th:first-child,.hourly td:first-child{text-align:left}.hourly th{position:sticky;top:0;background:#f6f8fa}.best{background:#eef7ee;font-weight:800}.source{font-size:12px;color:#64748b;margin-top:12px}.warn{font-size:12px;color:#64748b;margin-top:12px}.ok{color:#16733b;font-weight:700}.error{color:#b42318;font-weight:700}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.daily{grid-template-columns:repeat(4,1fr)}.obsgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr}.daily{grid-template-columns:repeat(2,1fr)}.formrow{grid-template-columns:1fr}.obsgrid{grid-template-columns:1fr 1fr}h1{font-size:25px}.wrap{padding:10px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>🎯 Easyspearfishing</h1><p>Condições para pesca submarina — Foz do Douro → Póvoa</p></div></header>
<main class="wrap"><section class="card"><h2>📍 Escolhe o spot</h2><div id="spots" class="grid"></div></section><section class="card" id="details"><h2>Seleciona um spot</h2><p class="mini">A app cruza condições do mar, vento, histórico recente e observações reais.</p></section></main>
<script>
const spots=[['Foz do Douro',41.148,-8.675],['Castelo do Queijo',41.169,-8.689],['Matosinhos',41.182,-8.705],['Leça da Palmeira',41.190,-8.704],['Marreco',41.235,-8.724],['Perafita',41.225,-8.716],['Angeiras',41.265,-8.722],['Labruge',41.280,-8.716],['Mindelo',41.316,-8.724],['Azurara',41.337,-8.741],['Vila do Conde',41.353,-8.744],['Póvoa de Varzim',41.381,-8.765]];
const el=document.querySelector('#spots'),details=document.querySelector('#details');const refs=[];let activeSpot=null,activeData=null;
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDir(d){if(!Number.isFinite(Number(d)))return '—';const a=['N','NE','E','SE','S','SW','W','NW'];return a[Math.round(Number(d)/45)%8]}
function visLabel(o){return o.visibility==='muito-boa'?'Muito boa':o.visibility==='boa'?'Boa':o.visibility==='media'?'Média':o.visibility==='fraca'?'Fraca':o.visibility==='muito-fraca'?'Muito fraca':(o.meters!=null?`${o.meters} m`:'—')}
function age(ts){const h=Math.max(0,(Date.now()-new Date(ts))/3600000);return h<1?`${Math.max(1,Math.round(h*60))} min`:h<24?`${Math.round(h)} h`:`${Math.round(h/24)} d`}
spots.forEach(s=>{const b=document.createElement('button');b.className='spot';b.innerHTML=`<div class="name">📍 ${esc(s[0])}</div><div class="score">⏳</div><div class="mini">A carregar...</div>`;b.onclick=()=>loadSpot(s,b);el.appendChild(b);refs.push([s,b]);});
Promise.all(refs.map(([s,b])=>loadSpot(s,b,false)));
async function loadSpot(s,b,show=true){try{const r=await fetch(`/api/spot?lat=${s[1]}&lon=${s[2]}&name=${encodeURIComponent(s[0])}${show?'&details=1':''}`);if(!r.ok)throw new Error('API indisponível');const d=await r.json();b.querySelector('.score').textContent=(d.statusEmoji||'🟡')+' '+(d.score==null?'—':d.score+'/10');b.querySelector('.mini').textContent=`👁️ ${d.underwaterVisibility.min}–${d.underwaterVisibility.max} m • ${d.wave} • ${d.wind}`;if(show){activeSpot=s;activeData=d;render(s,d)}}catch(e){b.querySelector('.score').textContent='⚠️';b.querySelector('.mini').textContent='Erro a carregar';if(show)details.innerHTML=`<h2>📍 ${esc(s[0])}</h2><p class="error">Não foi possível carregar os dados: ${esc(e.message)}</p>`}}
function render(s,d){
 const rows=(d.hourly||[]).map(h=>{const v=h.visibility||{};const best=d.bestWindow.startsWith(h.time.slice(11,16));return `<tr class="${best?'best':''}"><td>${h.time.slice(0,10)} ${h.time.slice(11,16)}</td><td>${Number.isFinite(h.wave)?h.wave.toFixed(1):'—'} m</td><td>${fmtDir(h.waveDirection)}</td><td>${Number.isFinite(h.period)?h.period.toFixed(1):'—'} s</td><td>${Number.isFinite(h.swell)?h.swell.toFixed(1):'—'} m</td><td>${Number.isFinite(h.swellPeriod)?h.swellPeriod.toFixed(1):'—'} s</td><td>${Number.isFinite(h.wind)?h.wind.toFixed(1):'—'} km/h</td><td>${fmtDir(h.windDirection)}</td><td>${Number.isFinite(h.gust)?h.gust.toFixed(1):'—'} km/h</td><td>${Number.isFinite(h.energy)?h.energy.toFixed(1):'—'}</td><td>${v.min!=null?`${v.min}–${v.max} m`:'—'}</td><td>${v.trend||'—'}</td><td>${v.confidenceLabel||'—'}</td><td>${Number.isFinite(h.atmosphericVisibility)?(h.atmosphericVisibility/1000).toFixed(1):'—'} km</td><td>${Number.isFinite(h.tideLevel)?h.tideLevel.toFixed(2):'—'}</td><td>${h.score??'—'}</td></tr>`}).join('');
 const daily=(d.daily||[]).map(x=>`<div class="day"><b>${esc(x.date.slice(5))}</b><br>🎯 ${x.score??'—'}/10<br>⏰ ${esc(x.bestTime||'—')}<br>👁️ ${x.visibility?x.visibility.min+'–'+x.visibility.max+' m':'—'}<br><span class="mini">${esc(x.status)}</span></div>`).join('');
 const obs=(d.observations||[]).map(o=>`<div class="obsitem">👁️ <b>${esc(visLabel(o))}</b>${o.state?' · '+esc(o.state):''}${o.depth!=null?' · '+esc(o.depth)+' m profundidade':''}<br><span class="mini">Há ${age(o.timestamp)}${o.note?' · '+esc(o.note):''}</span></div>`).join('')||'<div class="mini">Ainda não há observações deste spot.</div>';
 details.innerHTML=`<h2>📍 ${esc(s[0])} <span class="status">${d.statusEmoji} ${esc(d.status)}</span></h2>
 <div class="hero"><div class="decision"><h3>🎯 Se entrares agora</h3><div class="big">👁️ ${d.underwaterVisibility.min}–${d.underwaterVisibility.max} m</div><div>${esc(d.underwaterVisibility.trend)} · confiança ${esc(d.confidence)}</div><div class="mini">${d.underwaterVisibility.observations} observações recentes usadas</div><ul class="reasons">${(d.bestReasons.length?d.bestReasons:['mar e vento dentro dos parâmetros da previsão']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="decision"><h3>⏰ Melhor janela</h3><div class="big">${esc(d.bestWindow)}</div><div class="confidence">Easy Spear Score atual: <b>${d.score??'—'}/10</b></div><div class="mini">A janela é calculada apenas com horas de luz.</div></div></div>
 <div class="metrics"><div class="metric"><small>🌊 Onda</small><br><b>${esc(d.wave)}</b></div><div class="metric"><small>⏱️ Período</small><br><b>${esc(d.period)}</b></div><div class="metric"><small>🧭 Direção</small><br><b>${esc(d.direction)}</b></div><div class="metric"><small>🌡️ Água</small><br><b>${esc(d.waterTemp)}</b></div><div class="metric"><small>💨 Vento</small><br><b>${esc(d.wind)}</b></div><div class="metric"><small>💨 Rajadas</small><br><b>${esc(d.gust)}</b></div><div class="metric"><small>⚡ Energia</small><br><b>${esc(d.energy)}</b></div><div class="metric"><small>👁️ Vis. submarina</small><br><b>${d.underwaterVisibility.min}–${d.underwaterVisibility.max} m</b></div><div class="metric"><small>🌊 Swell</small><br><b>${esc(d.swell)} ${esc(d.swellDirection)}</b></div><div class="metric"><small>⏱️ Swell período</small><br><b>${esc(d.swellPeriod)}</b></div><div class="metric"><small>🌙 Nível do mar</small><br><b>${esc(d.tideLevel)}</b></div><div class="metric"><small>↗️ Corrente</small><br><b>${esc(d.currentSpeed)} ${esc(d.currentDirection)}</b></div></div>
 <div class="card" style="margin-top:16px;background:#f8fbff;border:1px solid #dcecff"><h3>📊 Concordância dos modelos</h3><div class="metrics"><div class="metric"><small>🌊 Ondas</small><br><b>${esc(d.modelAgreement?.waves?.label||'Indisponível')}</b><br><span class="mini">${d.modelAgreement?.waves?.count||0} modelos · spread ${d.modelAgreement?.waves?.spread??'—'} m</span></div><div class="metric"><small>⏱️ Período</small><br><b>${esc(d.modelAgreement?.periods?.label||'Indisponível')}</b><br><span class="mini">spread ${d.modelAgreement?.periods?.spread??'—'} s</span></div><div class="metric"><small>💨 Vento</small><br><b>${esc(d.modelAgreement?.winds?.label||'Indisponível')}</b><br><span class="mini">${d.modelAgreement?.winds?.count||0} modelos · spread ${d.modelAgreement?.winds?.spread??'—'} km/h</span></div><div class="metric"><small>🧠 Leitura</small><br><b>${(d.modelAgreement?.waves?.label==='Alta'&&d.modelAgreement?.winds?.label==='Alta')?'Modelos alinhados':'Alguma divergência'}</b><br><span class="mini">Usado como indicador de confiança, não como verdade absoluta.</span></div></div></div>
<div class="obsbox"><h3>👁️ Como encontraste a água?</h3><p class="mini">Ajuda a melhorar a previsão para este spot. Não precisas de conta.</p><div id="obsButtons" class="obsgrid"><button data-v="muito-boa">Muito boa<br><small>&gt;5 m</small></button><button data-v="boa">Boa<br><small>3–5 m</small></button><button data-v="media">Média<br><small>2–3 m</small></button><button data-v="fraca">Fraca<br><small>1–2 m</small></button><button data-v="muito-fraca">Muito fraca<br><small>&lt;1 m</small></button></div><div class="formrow"><input id="obsMeters" type="number" min="0" max="30" step="0.5" placeholder="Metros aproximados (opcional)"><select id="obsState"><option value="">Estado da água (opcional)</option><option>Limpa</option><option>Ligeiramente turva</option><option>Turva</option><option>Muito turva</option></select><input id="obsDepth" type="number" min="0" max="50" step="0.5" placeholder="Profundidade (opcional)"></div><div class="formrow"><textarea id="obsNote" placeholder="Nota opcional: água verde, fundo visível, muita suspensão, etc."></textarea></div><button id="sendObs" class="submit">Registar observação</button><div id="obsMsg" class="mini"></div><div class="obslist">${obs}</div></div>
 <h3>📅 Próximos 7 dias</h3><div class="daily">${daily}</div><div class="hourly"><table><thead><tr><th>Hora</th><th>Onda</th><th>Dir.</th><th>Per.</th><th>Swell</th><th>Swell Per.</th><th>Vento</th><th>Dir.</th><th>Rajadas</th><th>Energia</th><th>Vis. submarina</th><th>Tendência</th><th>Conf.</th><th>Vis. atmos.</th><th>Maré</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table></div><p class="source">Base: Open-Meteo Marine + Weather. A API marinha disponibiliza previsão horária e histórico recente; marés e correntes têm limitações costeiras documentadas.</p><p class="warn">${esc(d.note)}</p>`;
 details.querySelectorAll('#obsButtons button').forEach(btn=>btn.onclick=()=>{details.querySelectorAll('#obsButtons button').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');details.dataset.visibility=btn.dataset.v;});
 details.querySelector('#sendObs').onclick=submitObservation;
}
async function submitObservation(){const msg=details.querySelector('#obsMsg');const visibility=details.dataset.visibility||'';const meters=details.querySelector('#obsMeters').value;const state=details.querySelector('#obsState').value;const depth=details.querySelector('#obsDepth').value;const note=details.querySelector('#obsNote').value;if(!visibility&&!meters){msg.textContent='Escolhe uma categoria ou indica os metros.';msg.className='error';return}try{const r=await fetch('/api/observations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spot:activeSpot[0],visibility,meters,state,depth,note})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Erro');msg.textContent='Observação registada. Obrigado!';msg.className='ok';const refreshed=await fetch(`/api/spot?lat=${activeSpot[1]}&lon=${activeSpot[2]}&name=${encodeURIComponent(activeSpot[0])}`);activeData=await refreshed.json();render(activeSpot,activeData);}catch(e){msg.textContent=e.message;msg.className='error'}}
</script></body></html>
